[package]
name = "sootmark-disk"
version = "0.3.3"
edition = "2021"
rust-version = "1.80"
description = "Disk images for forensic intake: raw and split raw images, GPT and MBR partitions, NTFS (alternate data streams, compression), FAT and exFAT file listing with times, streaming reads, and loose $MFT files (deleted files included)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/disk"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response"]
# Sources only: test fixtures (disk images, logs, test keys) stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[dependencies]
common = { package = "sootmark-common", version = "0.3.6" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
